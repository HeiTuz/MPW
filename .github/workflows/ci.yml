name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  self-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: oven-sh/setup-bun@v2
      # The supported MPW suite is self-contained. Retired external integrations
      # are manual diagnostics under tools/legacy, not release prerequisites.
      - name: supported network-free test suite
        run: npm test
      - name: legacy diagnostic fails closed without external sources
        run: python3 tools/legacy/test_adapter_master_integration.py ExternalDependencyPolicyTests
      - name: plugin build validates and packed CLI copies the payload
        shell: bash
        run: |
          node scripts/build_plugin.mjs --check
          pack_dir="$(mktemp -d)"
          tarball="$(npm pack --pack-destination "$pack_dir" --silent)"
          package="$pack_dir/$tarball"
          npx_home="$(mktemp -d)"
          HOME="$npx_home" npx --yes --package "$package" heituzmpw -- --dest "$npx_home/skills/MPW" --force --quiet
          test -f "$npx_home/skills/MPW/SKILL.md"
          grep -q 'host_surface: plugin' "$npx_home/skills/MPW/SKILL.md"
          bunx_home="$(mktemp -d)"
          HOME="$bunx_home" bunx --package "$package" heituzmpw -- --dest "$bunx_home/skills/MPW" --force --quiet
          test -f "$bunx_home/skills/MPW/contracts/v1/image-production-handoff.schema.json"
          HOME="$bunx_home" bunx --package "$package" heituzmpw | grep -q 'mpw@heituz'
